<!DOCTYPE html>
<html>
<head>
  <style>
    /* This centers everything in the middle of the page */
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;  /* centers vertically */
      align-items: center;      /* centers horizontally */
      height: 100vh;            /* makes the body take full screen height */
      margin: 0;                /* removes default margin */
      background-color: #a0f0f0; /* optional background */
      font-family: Arial, sans-serif;
    }

    h2 {
      font-size: 50px;
    }

    button {
      padding: 10px 25px;
      font-size: 18px;
      cursor: pointer;
      color:#00ff00;
      background-color: #ff0500;
    }
  </style>
</head>
<body>
  <h2 id="text">Simple</h2>
  <button onclick="changeWord()">Press</button>

  <script>
    function changeWord() {
      document.getElementById("text").innerText = "And easy";
    }
  </script>
</body>
</html>
